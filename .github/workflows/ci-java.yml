name: CI Java

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Compilar testes
        run: mvn --batch-mode --no-transfer-progress test-compile

      - name: Executar testes unitários
        run: mvn --batch-mode --no-transfer-progress test -Dgroups=unit
